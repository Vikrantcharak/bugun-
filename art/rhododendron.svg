<style>
.mist{animation:drift 30s ease-in-out infinite alternate}.m2{animation-duration:38s;animation-delay:-12s}
@keyframes drift{from{transform:translateX(-70px)}to{transform:translateX(80px)}}
.tree{transform-box:fill-box;transform-origin:50% 100%;animation:lean 9s ease-in-out infinite alternate}
@keyframes lean{from{transform:rotate(-.5deg)}to{transform:rotate(.6deg)}}
.truss{transform-box:fill-box;transform-origin:50% 70%;animation:nod 6s ease-in-out infinite alternate}
.t2{animation-duration:7.4s;animation-delay:-2s}.t3{animation-duration:5.4s;animation-delay:-3s}.t4{animation-duration:6.6s;animation-delay:-1s}.t5{animation-duration:8s;animation-delay:-4s}
@keyframes nod{from{transform:rotate(-1.6deg)}to{transform:rotate(1.8deg)}}
.petal{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:fall 11s linear infinite}
.p2{animation-duration:14s;animation-delay:-4s}.p3{animation-duration:12s;animation-delay:-8s}.p4{animation-duration:16s;animation-delay:-2s}
.p5{animation-duration:13s;animation-delay:-10s}.p6{animation-duration:15s;animation-delay:-6s}
@keyframes fall{0%{opacity:0;transform:translate(0,0) rotate(0)}8%{opacity:.95}35%{transform:translate(34px,170px) rotate(120deg)}70%{transform:translate(-22px,360px) rotate(250deg)}92%{opacity:.9}100%{opacity:0;transform:translate(18px,520px) rotate(380deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
