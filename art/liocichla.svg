<g class="tail"><path d="M262 166 L374 214 L363 233 L250 192 Z" fill="#33342d"/><path d="M344 201 L374 214 L363 233 L335 222 Z" fill="#c8452e"/><path d="M270 172 L352 207" stroke="#55574b" stroke-width="2"/><path d="M250 190 L300 200 L262 211 Z" fill="#b83a2a"/></g>
<g class="body"><path d="M120 150 C120 105, 165 85, 215 92 C262 99, 292 130, 288 165 C284 200, 245 222, 198 218 C150 214, 120 192, 120 150 Z" fill="#7d8466"/><path d="M136 180 C162 212, 215 222, 258 204 C232 228, 162 230, 136 180 Z" fill="#9aa081"/><path d="M178 128 C215 110, 264 122, 282 156 C254 170, 208 168, 178 148 Z" fill="#676d55"/><path d="M194 130 C214 121, 240 124, 256 137 C238 145, 214 145, 194 138 Z" fill="#e9b13e"/><path d="M208 147 C232 151, 256 151, 276 155 C258 164, 228 163, 208 153 Z" fill="#c8452e"/><path d="M214 158 C236 163, 256 163, 274 160" stroke="#f1e6c8" stroke-width="2.4" fill="none" stroke-linecap="round"/></g>
<g class="head"><circle cx="128" cy="118" r="38" fill="#7d8466"/><path d="M92 108 C96 76, 142 66, 164 98 C146 90, 114 92, 92 108 Z" fill="#1e1e1a"/><ellipse cx="111" cy="123" rx="15" ry="10.5" fill="#e9a23b"/><path d="M130 114 C142 109, 154 111, 162 118" stroke="#e9b13e" stroke-width="4.5" fill="none" stroke-linecap="round"/><g class="eye"><circle cx="124" cy="117" r="5.4" fill="#141412"/><circle cx="125.8" cy="115.2" r="1.6" fill="#fff"/></g><path d="M94 113 L70 121 L94 129 Z" fill="#2b2b26"/><path d="M94 121 L72 121" stroke="#4a4a42" stroke-width="1.2"/></g>
</g>
<g class="fall"><path transform="translate(1010 -60)" d="M0 0 C 14 -14, 36 -14, 50 0 C 36 14, 14 14, 0 0 Z" fill="#8fae5a"/></g>
<g class="fall f2"><path transform="translate(300 -60) rotate(30)" d="M0 0 C 12 -12, 30 -12, 42 0 C 30 12, 12 12, 0 0 Z" fill="#a9be6a"/></g>
</svg>
