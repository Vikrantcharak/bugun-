<g fill="#7e9c4c"><path d="M150 570q20-24 46-14q-18 6-14 22z"/><path d="M330 546q14-26 44-18q-20 6-16 20z"/><path d="M760 518q18-22 44-12q-20 6-16 18z"/><path d="M1040 492q16-22 40-14q-18 6-14 18z"/><path d="M450 536q10-16 30-12q-12 6-8 14z"/></g>
