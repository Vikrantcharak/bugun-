<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Drawing of a Bugun liocichla on a mossy branch in the forest">
<title>Bugun liocichla (a drawing)</title>
<defs>
<radialGradient id="bg" cx=".5" cy=".42" r=".78"><stop offset="0" stop-color="#4d7d5a"/><stop offset=".55" stop-color="#2a4f3a"/><stop offset="1" stop-color="#12281c"/></radialGradient>
<radialGradient id="spot"><stop offset="0" stop-color="#e3f0c8" stop-opacity=".55"/><stop offset=".6" stop-color="#cfe3b6" stop-opacity=".16"/><stop offset="1" stop-color="#cfe3b6" stop-opacity="0"/></radialGradient>
<linearGradient id="bark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6f553b"/><stop offset="1" stop-color="#3e2c1c"/></linearGradient>
</defs>
<style>
.spot{animation:glow 8s ease-in-out infinite alternate}
.s2{animation-duration:11s;animation-delay:-3s}.s3{animation-duration:9s;animation-delay:-6s}
.s4{animation-duration:13s;animation-delay:-2s}.s5{animation-duration:10s;animation-delay:-7s}.s6{animation-duration:12s;animation-delay:-4s}
@keyframes glow{from{opacity:.25;transform:translate(0,0)}to{opacity:.7;transform:translate(14px,-18px)}}
.edge{transform-box:fill-box;animation:sway 9s ease-in-out infinite alternate}
.tl{transform-origin:0% 0%}.tr{transform-origin:100% 0%;animation-duration:11s}
.bl{transform-origin:0% 100%;animation-duration:12s}.br{transform-origin:100% 100%;animation-duration:10s}
@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.8deg)}}
.twig{transform-box:fill-box;transform-origin:0% 100%;animation:sway 6s ease-in-out infinite alternate}
.body{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(1,1)}to{transform:scale(1.012,1.022)}}
.head{transform-box:fill-box;transform-origin:83% 92%;animation:tilt 9s ease-in-out infinite}
@keyframes tilt{0%,48%{transform:rotate(0)}53%,66%{transform:rotate(-11deg)}71%,84%{transform:rotate(7deg)}90%,100%{transform:rotate(0)}}
.eye{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.6s linear infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
.tail{transform-box:fill-box;transform-origin:5% 19%;animation:flick 6.4s ease-in-out infinite}
@keyframes flick{0%,74%,100%{transform:rotate(0)}78%{transform:rotate(-9deg)}83%{transform:rotate(4deg)}88%{transform:rotate(-5deg)}94%{transform:rotate(0)}}
.fall{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:fall 17s linear infinite}
.f2{animation-duration:23s;animation-delay:-9s}
@keyframes fall{0%{opacity:0;transform:translate(0,0) rotate(0)}6%{opacity:.9}50%{transform:translate(-90px,520px) rotate(170deg)}94%{opacity:.9}100%{opacity:0;transform:translate(-40px,1040px) rotate(330deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
